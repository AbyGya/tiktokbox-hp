plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tiktokbox.hp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tiktokbox.hp'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.java-websocket:Java-WebSocket:1.5.6'
}
