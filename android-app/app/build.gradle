plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tiktokbox.hp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tiktokbox.hp'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
